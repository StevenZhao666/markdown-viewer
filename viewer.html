<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Viewer v4</title>
<link rel="stylesheet" href="lib/katex/katex.min.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css'">
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* ══════ 颜色系统: 改--color-accent一个变量全局生效 ══════ */
:root{
  --color-accent:#007acc;--color-accent-hover:#0098ff;--color-accent-dim:#005a8c;--color-accent-pale:#005577;
  --color-bg:#1e1e1e;--color-bg-secondary:#252526;--color-bg-tertiary:#333;--color-bg-code:#242424;--color-text-faint:#808080;--color-code:#e8a050;
  --color-text:#e0e0e0;--color-text-dim:#aaa;
  --font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
body{font-family:var(--font-ui);background:var(--color-bg);color:var(--color-text);height:100vh;display:flex;overflow:hidden;font-size:15px}
.sidebar{width:280px;background:var(--color-bg-secondary);border-right:1px solid #444;display:flex;flex-direction:column;flex-shrink:0;position:relative}
.sidebar.collapsed{width:0;min-width:0;overflow:hidden;border-right:none}   /* v4.8.6: 完全收起（原来留 30px 空条） */
/* v4.8.5: 折叠时把展开按钮收回栏内——原来 right:-14px 的部分被 overflow:hidden 裁掉，鼠标点不到，"折叠后就无法展开" */
/* v4.8.6: 折叠时按钮变成屏幕左边缘的小把手（fixed 能突破父级 overflow:hidden 的裁剪） */
.sidebar.collapsed .sidebar-toggle{position:fixed;left:0;top:6px;width:24px;height:26px;min-width:24px;padding:0;
  border:1px solid var(--color-accent);border-radius:3px;background:var(--color-accent);color:#fff;font-size:11px;line-height:24px;text-align:center;z-index:99}
/* v4.8.9: 收起时工具栏左侧给把手让位（文件名右移，不再被挡） */
.sidebar.collapsed ~ .main .toolbar{padding-left:34px}
.sidebar.collapsed .sidebar-header button:not(.sidebar-toggle){display:none}
.sidebar.collapsed #tree{display:none}
/* v4.8.6: 展开态——按钮就在侧栏头部行内（不再悬浮在分界线上） */
.sidebar-header .sidebar-toggle{flex:0 0 auto;width:24px;min-width:24px;padding:5px 0;text-align:center;font-size:11px;line-height:1.3}
.sidebar-toggle:hover{background:#007acc;color:#fff}
.sidebar-header{padding:8px 10px;border-bottom:1px solid #444;display:flex;gap:4px;align-items:center}
.sidebar-header button{flex:1;padding:5px 8px;border:1px solid #666;background:var(--color-btn);color:var(--color-text);border-radius:3px;cursor:pointer;font-size:12px;white-space:nowrap}
.sidebar-header button:hover{background:var(--color-btn-hover)}
.sidebar-header button.primary{border-color:#007acc;color:#fff;background:#0e639c}
#tree{flex:1;overflow-y:auto;padding:4px 0;font-size:14px}
.tree-item{display:flex;align-items:center;padding:5px 8px;cursor:pointer;white-space:nowrap;user-select:none;gap:4px}
.tree-item:hover{background:var(--color-block-hover)}
.tree-item.active{background:#094771}
.tree-item .icon{width:18px;text-align:center;flex-shrink:0;font-size:14px}
.tree-item .name{overflow:hidden;text-overflow:ellipsis;color:var(--color-text)}
.tree-item.folder>.name{color:#e8c170}
.tree-item.file>.name{color:var(--color-text)}
.tree-item .arrow{width:14px;text-align:center;flex-shrink:0;font-size:11px;transition:transform .15s;color:var(--color-text-faint)}
.tree-item .arrow.expanded{transform:rotate(90deg)}
.tree-children{padding-left:14px}
.tree-children.hidden{display:none}
.tree-empty{padding:40px 20px;text-align:center;color:var(--color-text-faint);font-size:14px;line-height:1.8}
.tree-empty u{cursor:pointer;color:#5aafff}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.toolbar{padding:6px 12px;background:var(--color-bg-secondary);border-bottom:1px solid #444;display:flex;gap:8px;align-items:center;min-height:32px;flex-shrink:0}
.toolbar span{font-size:13px;color:var(--color-text-dim)}
#dropZone{flex:1;display:flex;align-items:center;justify-content:center;color:var(--color-text-dim);font-size:16px;border:2px dashed #555;margin:20px;border-radius:8px;transition:all .2s;text-align:center;line-height:1.8}
#dropZone u{cursor:pointer;color:#5aafff}
#previewWrap{flex:1;overflow:hidden;display:none;position:relative}
#preview{height:100%;overflow-y:auto;padding:20px 36px 80px;scroll-behavior:smooth;font-size:15px;color:var(--color-text);line-height:1.8}
/* v4.5.0 标签页 */
#tabBar{display:flex;align-items:stretch;gap:2px;padding:4px 6px 0;background:var(--color-bg-secondary);border-bottom:1px solid var(--color-border);min-height:34px;flex-wrap:nowrap;overflow-x:auto}
#tabBar::-webkit-scrollbar{height:4px}
#tabBar::-webkit-scrollbar-thumb{background:#555;border-radius:2px}
.tab{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 14px;background:var(--color-btn);border:1px solid var(--color-border);border-bottom:none;border-radius:6px 6px 0 0;color:var(--color-text-dim);font-size:12px;cursor:pointer;max-width:180px;white-space:nowrap;flex-shrink:0}
.tab:hover{background:var(--color-btn-hover);color:var(--color-text)}
.tab.active{background:var(--color-bg);color:var(--color-text);border-color:var(--color-accent);border-bottom:1px solid var(--color-bg)}
.tab .tab-name{overflow:hidden;text-overflow:ellipsis}
.tab .tab-dirty{color:var(--color-accent);font-size:10px}
.tab .tab-close{padding:0 3px;border-radius:3px;font-size:11px;color:var(--color-text-faint);line-height:1}
.tab .tab-close:hover{background:var(--color-accent);color:#fff}
.tab-rename{width:110px;background:var(--color-bg);color:var(--color-text);border:1px solid var(--color-accent);border-radius:3px;padding:1px 6px;font-size:12px;outline:none}
.tab-new{display:inline-flex;align-items:center;justify-content:center;width:30px;flex-shrink:0;background:none;border:1px dashed var(--color-border);border-bottom:none;border-radius:6px 6px 0 0;color:var(--color-text-dim);font-size:16px;cursor:pointer}
.tab-new:hover{background:var(--color-btn-hover);color:var(--color-accent)}
.toc-panel{width:230px;background:var(--color-bg-secondary);border-left:1px solid #444;display:none;flex-direction:column;flex-shrink:0}
.toc-panel.visible{display:flex}
.toc-header{padding:8px 10px;border-bottom:1px solid #444;font-size:12px;color:var(--color-text-dim);text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
.toc-header button{background:none;border:none;color:var(--color-text-dim);cursor:pointer;font-size:16px;padding:0 4px}
.toc-header button:hover{color:var(--color-text)}
#tocList{flex:1;overflow-y:auto;padding:6px 0}
#tocList .toc-item{display:block;padding:5px 12px 5px 16px;cursor:pointer;color:var(--color-text);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid transparent;transition:all .1s;font-size:13px}
#tocList .toc-item:hover{color:var(--color-text);background:var(--color-block-hover)}
/* 各级别同时高亮,互不干扰——h1最亮→h6最淡(opacity递减) */
#tocList .toc-item.lvl1.active{color:#fff;background:var(--color-accent-pale);border-left-color:var(--color-accent);opacity:1}
#tocList .toc-item.lvl2.active{color:#fff;background:var(--color-accent-pale);border-left-color:var(--color-accent-dim);opacity:0.82}
#tocList .toc-item.lvl3.active{color:#fff;background:var(--color-accent-pale);border-left-color:var(--color-accent-dim);opacity:0.65}
#tocList .toc-item.lvl4.active{color:#fff;background:var(--color-accent-pale);border-left-color:var(--color-accent-dim);opacity:0.5}
#tocList .toc-item.lvl5.active{color:var(--color-text-dim);background:var(--color-accent-pale);border-left-color:var(--color-accent-dim);opacity:0.38}
#tocList .toc-item.lvl6.active{color:var(--color-text-dim);background:var(--color-accent-pale);border-left-color:var(--color-accent-dim);opacity:0.28}
#tocList .toc-item.lvl1{padding-left:16px;font-weight:500}
#tocList .toc-item.lvl2{padding-left:28px;font-size:12px}
#tocList .toc-item.lvl3{padding-left:40px;font-size:12px;color:var(--color-text-faint)}
#tocList .toc-item.lvl4{padding-left:52px;font-size:11px;color:var(--color-text-faint)}
#tocList .toc-item.lvl5{padding-left:62px;font-size:11px;color:var(--color-text-faint)}
#tocList .toc-item.lvl6{padding-left:72px;font-size:11px;color:var(--color-text-faint)}
.toc-empty{padding:20px;text-align:center;color:var(--color-text-faint);font-size:13px}
/* 设置弹窗 */
.set-modal{position:fixed;inset:0;background:transparent;display:none;align-items:center;justify-content:center;z-index:1000}
.set-modal.show{display:flex}
.set-box{width:300px;background:var(--color-bg-secondary);border:1px solid var(--color-border);border-radius:8px;padding:16px;color:var(--color-text);box-shadow:0 8px 32px rgba(0,0,0,.28)}
.set-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;font-weight:600}
.set-header button{background:none;border:none;color:var(--color-text-dim);cursor:pointer;font-size:16px}
.set-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
.set-row label{width:70px;flex-shrink:0;color:var(--color-text-dim)}
.set-row input[type="color"]{width:36px;height:26px;border:1px solid var(--color-border);border-radius:3px;padding:1px;cursor:pointer}
.set-row select{flex:1;background:var(--color-btn);color:var(--color-text);border:1px solid var(--color-border);border-radius:3px;padding:4px 6px;font-size:12px}
.set-hex{font-size:11px;color:var(--color-text-faint);font-family:monospace}
.set-row button{background:var(--color-btn);border:1px solid var(--color-border);color:var(--color-text);border-radius:3px;padding:4px 12px;cursor:pointer;font-size:12px}
.set-row button:hover{background:var(--color-btn-hover)}
#tcReset{font-size:10px;padding:2px 8px;background:var(--color-btn);border:1px solid var(--color-border);color:var(--color-text-dim);border-radius:3px;cursor:pointer;margin-left:auto}
#tcReset:hover{background:var(--color-btn-hover);color:#fff}
#preview h1,#preview h2,#preview h3{scroll-margin-top:10px}
#preview h1,#preview h2,#preview h3{color:var(--color-text);margin:24px 0 12px}
#preview h1{font-size:26px;border-bottom:1px solid #555;padding-bottom:10px}
#preview h2{font-size:22px}
#preview h3{font-size:18px;color:var(--color-text)}
#preview p{margin:10px 0}
#preview code{background:var(--color-bg-code);padding:2px 6px;border-radius:3px;font-size:14px;color:var(--color-code)}
#preview pre{background:var(--color-bg-code);border:1px solid var(--color-border);border-radius:6px;padding:18px;overflow-x:auto;margin:14px 0}
#preview pre code{background:none;padding:0;color:var(--color-text);font-size:14px}
#preview ul,#preview ol{padding-left:28px;margin:10px 0}
#preview li{margin:4px 0}
#preview a{color:var(--color-link)}
#preview blockquote{border-left:3px solid var(--color-border);padding-left:14px;color:var(--color-text-dim);margin:14px 0}
#preview table{border-collapse:collapse;margin:14px 0;width:100%}
#preview th,#preview td{border:1px solid var(--color-rule);padding:10px 14px;text-align:left}
#preview th{background:var(--color-bg-code);color:var(--color-text)}
#preview img{max-width:100%}
#preview hr{border:none;border-top:1px solid var(--color-rule);margin:24px 0}
/* 块编辑 */
.block{padding:8px 12px;border-radius:6px;transition:background .1s;cursor:text;position:relative}
.block:hover{background:var(--color-block-hover)}
.empty-hint{color:var(--color-text-faint);font-size:13px;display:block;padding:4px 0}
.block-editing{position:relative;background:var(--color-block-hover);outline:2px solid var(--color-accent);margin:4px 0;padding:0}
.block-editor{width:100%;min-height:100px;background:var(--color-bg);color:var(--color-text);border:1px solid #444;padding:12px 16px;font-family:'Consolas','Courier New',monospace;font-size:14px;line-height:1.7;resize:vertical;outline:none;box-sizing:border-box}
.block-done{position:absolute;top:-28px;right:0;padding:3px 10px;background:#0e639c;color:#fff;border:none;border-radius:3px;cursor:pointer;font-size:12px;z-index:10}
.block-done:hover{background:#007acc}
.block-tb-toggle{position:absolute;top:-28px;right:80px;padding:3px 8px;background:var(--color-btn);color:var(--color-text-dim);border:1px solid var(--color-border);border-radius:3px;cursor:pointer;font-size:14px;z-index:10}
.block-tb-toggle:hover{background:var(--color-btn-hover)}
/* v4 分屏编辑 */
.block-edit-split{display:flex;gap:12px;min-height:120px}
.block-edit-split .block-editor{flex:1;min-width:0}
.block-edit-preview{flex:1;min-width:0;overflow-y:auto;padding:8px 12px;background:var(--color-bg);border:1px solid #444;border-radius:4px;font-size:14px;line-height:1.6;color:var(--color-text)}
.block-edit-preview h1,.block-edit-preview h2,.block-edit-preview h3{color:var(--color-text);margin:6px 0 3px;font-size:15px}
.block-edit-preview p{margin:3px 0}
.md-space{height:0.85em}
.block-edit-preview code{background:var(--color-bg-code);padding:1px 4px;border-radius:2px;color:var(--color-code);font-size:12px}
.block-edit-preview table{border-collapse:collapse;margin:8px 0;width:100%;font-size:13px}
.block-edit-preview th,.block-edit-preview td{border:1px solid #555;padding:4px 8px;text-align:left}
.block-edit-preview th{background:var(--color-btn);color:var(--color-text);font-weight:600}
/* 符号工具栏 */
#toolbar{width:320px;flex-shrink:0;background:var(--color-bg-secondary);border-left:1px solid #444;display:none;flex-direction:column;overflow-y:auto}
#toolbar.show{display:flex}
.tb-header{padding:10px 12px;border-bottom:1px solid #444;font-size:13px;color:var(--color-text-dim);display:flex;justify-content:space-between;align-items:center}
.tb-header button{background:none;border:none;color:var(--color-text-faint);cursor:pointer;font-size:16px;padding:0 4px}
.tb-header button:hover{color:var(--color-text)}
.tb-scroll{flex:1;overflow-y:auto;padding:8px}
.tb-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 12px;background:var(--color-btn);color:#ddd;border:1px solid var(--color-border);border-radius:4px;cursor:pointer;font-size:14px;font-family:'Times New Roman',serif;transition:all .1s;margin:2px 0}
.tb-btn:hover{background:var(--color-btn-hover);border-color:var(--color-accent);color:#fff}
.tb-btn .tsym{font-size:20px;min-width:28px;text-align:center}
.tb-btn .ttpl{font-size:12px;color:var(--color-text-dim);font-family:monospace}
.tb-btn:hover .ttpl{color:var(--color-text-dim)}
.tb-preview{flex:1;overflow-y:auto;padding:12px;background:var(--color-bg);border-top:1px solid #444;font-size:14px;line-height:1.6;color:var(--color-text);min-height:80px}
.tb-preview h1,.tb-preview h2,.tb-preview h3{color:var(--color-text);margin:8px 0 4px;font-size:15px}
.tb-preview p{margin:4px 0}
.tb-preview code{background:var(--color-bg-code);padding:1px 4px;border-radius:2px;color:var(--color-code);font-size:12px}
.tb-preview table{border-collapse:collapse;margin:10px 0;width:100%;font-size:13px}
.tb-preview th,.tb-preview td{border:1px solid #555;padding:6px 10px;text-align:left}
.tb-preview th{background:var(--color-btn);color:var(--color-text);font-weight:600}
/* 拖拽 */
.resize-handle{width:5px;cursor:col-resize;flex-shrink:0;transition:background .15s}
.resize-handle:hover,.resize-handle.dragging{background:#007acc}
/* 结构工具 */
.tb-struct-btn{flex:1;padding:5px 4px;border:1px solid var(--color-border);background:var(--color-btn);color:var(--color-text-dim);border-radius:3px;cursor:pointer;font-size:11px;white-space:nowrap}
.tb-struct-btn:hover{background:var(--color-btn-hover);border-color:var(--color-accent);color:#fff}
.tb-grid-picker{display:none;position:absolute;right:0;top:70px;background:var(--color-btn);border:1px solid var(--color-border);border-radius:6px;padding:8px;z-index:100}
.tb-grid-picker.show{display:block}
.tb-grid-picker span{display:block;text-align:center;font-size:12px;color:#aaa;margin-bottom:4px}
.tb-grid-row{display:flex;gap:2px;margin-bottom:2px}
.tb-grid-cell{width:18px;height:18px;border:1px solid #666;border-radius:2px;transition:background .1s}
.tb-grid-cell.hover{background:#007acc;border-color:#5aafff}
/* 公式模板按钮 */
.fe-label{font-size:11px;color:#888;margin:4px 0}
.fe-tpl-grid{display:flex;gap:4px;flex-wrap:wrap}
.fe-tpl-btn{flex:1 1 calc(50% - 4px);padding:6px 4px;background:var(--color-btn);border:1px solid var(--color-border);border-radius:4px;cursor:pointer;color:#ddd;font-size:11px;text-align:center;transition:.1s}
.fe-tpl-btn:hover{background:var(--color-btn-hover);border-color:var(--color-accent)}
.fe-tpl-btn .fe-vis{font-size:16px;color:#ccc;margin-top:2px;font-family:'Times New Roman',serif}
/* 可视化公式块 + Canvas */
.fe-canvas{min-height:80px;padding:10px;background:var(--color-bg);border:1px solid #555;border-radius:4px;margin-bottom:6px;display:flex;align-items:center;flex-wrap:wrap;gap:10px;font-size:16px;font-family:'Times New Roman',serif;color:var(--color-text)}

/* v4.3.0 重构: 节点可点击+占位符 */
.fe-node{display:inline-flex;vertical-align:middle;align-items:center;margin:0 1px;cursor:pointer;border-radius:3px;transition:background .1s}
.fe-node:hover{background:var(--color-block-hover);outline:1px solid var(--color-accent)}
.fe-node.fe-editing{outline:2px solid var(--color-accent);background:var(--color-bg-code)}
/* v4.8.0: 选中的槽位/节点(点模板会插到这里) */
.fe-node.fe-focused{outline:2px dashed var(--color-accent);outline-offset:2px;background:var(--color-block-hover)}
.fe-ph.fe-focused{border-style:solid;border-color:var(--color-accent);background:var(--color-accent-pale)}
.fe-text{padding:0 1px;color:var(--color-text)}
.fe-ph{min-width:26px;height:26px;border:2px dashed var(--color-accent-dim);border-radius:4px;background:var(--color-bg-tertiary)}
.fe-ph:hover{background:var(--color-btn-hover)}
.fe-subsup{position:relative}
.fe-subsup-base{display:inline-block}
.fe-subsup-sup{font-size:.72em;vertical-align:super;line-height:1}
.fe-subsup-sub{font-size:.72em;vertical-align:sub;line-height:1}
.fe-int{display:inline-flex;align-items:center}
.fe-int-sym{font-size:1.5em;margin-right:2px}
.fe-int-sub{font-size:.7em;vertical-align:sub}
.fe-int-sup{font-size:.7em;vertical-align:super}
.fe-int-expr{display:inline-block;padding:0 2px}
.fe-int-d{font-style:italic;margin:0 1px}
.fe-sum{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1}
.fe-sum-sym{font-size:1.4em}
.fe-sum-sup{font-size:.68em}
.fe-sum-sub{font-size:.68em}
.fe-sum-expr{display:inline-block;margin-left:3px}
.fe-lim{display:inline-flex;align-items:center;margin:0 3px}
.fe-lim-text{font-style:italic;margin-right:1px}
.fe-lim-sub{font-size:.7em;vertical-align:sub}
.fe-lim-expr{display:inline-block;margin-left:2px}
.fe-edit-box{display:inline-block;min-width:40px;padding:2px 6px;border:1px solid var(--color-accent);border-radius:4px;background:var(--color-bg-code);color:var(--color-text);font-family:'Consolas','Courier New',monospace;font-size:15px;outline:none;white-space:nowrap;vertical-align:middle}
.fe-edit-box:focus{border-color:var(--color-accent);box-shadow:0 0 0 2px var(--color-accent-dim)}
.fe-mtx{display:inline-flex;flex-direction:column;border-left:2px solid var(--color-text-dim);border-right:2px solid var(--color-text-dim);padding:3px 6px;margin:0 3px}
.fe-mtx-row{display:flex;align-items:center}
.fe-mtx-cell{display:inline-block;padding:0 4px;min-width:16px;text-align:center}
.fe-mtx-cell:not(:first-child){border-left:1px dashed var(--color-border)}
.fe-canvas .hint{color:#555;font-size:13px;width:100%}
/* v4.1.10: 槽位——默认透明让预览可见，聚焦后显示编辑框 */
.fe-slot{display:inline-block;position:relative;z-index:1;min-width:32px;padding:4px 8px;border:2px dashed transparent;border-radius:4px;background:transparent;color:transparent;caret-color:#e0e0e0;text-align:center;font-size:16px;font-family:'Times New Roman',serif;vertical-align:middle;outline:none;cursor:text}
.fe-slot:focus{color:#e0e0e0;border-color:#5aafff;border-style:solid;background:#1a3a4a}
.fe-slot:empty::before{content:attr(data-ph);color:transparent}
/* v4.1.10: 预览层浮在编辑层上方，pointer-events穿透点击直达编辑层 */
.fe-slw{position:relative;display:inline-block;vertical-align:middle;cursor:text}
.fe-slr{pointer-events:none;position:absolute;top:0;left:0;z-index:2;white-space:nowrap;min-width:32px;padding:4px 8px;border:2px dashed transparent;border-radius:4px;color:var(--color-text);text-align:center;font-size:16px}
.fe-slr .katex{font-size:15px}
.fe-slot:focus~.fe-slr{visibility:hidden} /* 编辑时隐藏预览 */
.fe-frac{display:inline-grid;grid-template-areas:'num''line''den';grid-template-columns:1fr;justify-items:center;vertical-align:middle;margin:0 4px;row-gap:2px}
.fe-frac-num{grid-area:num}.fe-frac-den{grid-area:den}
.fe-frac-line{grid-area:line;width:100%;min-width:40px;height:2px;background:var(--color-text-dim)}
.fe-binom{display:inline-flex;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.15}
.fe-binom-paren{font-size:24px;color:var(--color-text);font-family:'Times New Roman',serif;line-height:1}
.fe-binom-stack{display:inline-flex;flex-direction:column;justify-content:center;text-align:center;padding:0 2px}
.fe-binom-top,.fe-binom-bot{display:block;min-width:24px}
.fe-sqrt{display:inline-flex;align-items:center;vertical-align:middle;margin:0 4px}
.fe-sqrt-sign{font-size:20px;color:var(--color-text);margin-right:1px;font-family:'Times New Roman',serif}
.fe-sqrt-overline{border-top:2px solid var(--color-text-dim);padding-top:1px;margin-left:-1px}
.fe-int{display:inline-grid;grid-template-areas:'. sup .''sym . expr''. sub .';grid-template-columns:auto 8px 1fr;align-items:center;justify-items:center;vertical-align:middle;margin:0 4px;column-gap:2px;row-gap:1px}
.fe-int-sym{grid-area:sym;font-size:26px;color:#ddd;font-family:'Times New Roman',serif}
.fe-int-sub{grid-area:sub;font-size:13px}.fe-int-sup{grid-area:sup;font-size:13px}
.fe-int-expr{grid-area:expr;display:flex;gap:2px;align-items:baseline}
.fe-sup{display:inline-flex;align-items:baseline;vertical-align:middle;margin:0 4px}
.fe-sup .fe-sup-dot{color:#555;font-size:14px;margin-right:1px}
.fe-sup sup{font-size:13px;color:#ccc}
.fe-sum{display:inline-grid;grid-template-areas:'sup sup .''sym . expr''sub sub .';grid-template-columns:auto auto auto;align-items:center;justify-items:center;vertical-align:middle;margin:0 4px;column-gap:4px;row-gap:1px}
.fe-sum-sym{grid-area:sym;font-size:28px;color:#ddd;font-family:'Times New Roman',serif}
.fe-sum-sub{grid-area:sub;font-size:13px}.fe-sum-sup{grid-area:sup;font-size:13px}
.fe-sum-expr{grid-area:expr;align-self:center}
.fe-lim{display:inline-grid;grid-template-areas:'text expr''sub .';grid-template-columns:auto auto;align-items:center;justify-items:start;vertical-align:middle;margin:0 4px;column-gap:6px;row-gap:1px}
.fe-lim-text{grid-area:text;font-size:14px;color:#ddd}
.fe-lim-sub{grid-area:sub;font-size:13px;color:#ccc}.fe-lim-expr{grid-area:expr}
.fe-mtx{display:inline-flex;align-items:center;vertical-align:middle;margin:0 4px;font-size:20px;color:#aaa}
.fe-latex{padding:4px 8px;background:#1e1e1e;border-radius:3px;margin:4px 0;font-size:11px;color:#888}
.fe-latex code{color:#f0a060;font-size:11px}

.fe-clear-btn{flex:1;padding:7px;background:#555;border:none;border-radius:4px;color:#ccc;cursor:pointer;font-size:12px}
.fe-clear-btn:hover{background:#666}
</style>

<script>
const $=id=>document.getElementById(id);
const tree=$('tree'), preview=$('preview'), previewWrap=$('previewWrap'),
  dropZone=$('dropZone'), pathBar=$('pathBar'),
  tabBar=$('tabBar'),
  tocPanel=$('tocPanel'), tocList=$('tocList');
let dirHandle=null, activeEl=null, headingIds=[];
let _lastTreeRefresh=0;   // v4.8.7: focus 自动刷新节流
// v4.5.0 多标签: tabs 数组 + activeTab 索引
let tabs=[];          // [{name, mdText, fileHandle, filePath, dirty}]
let activeTab=-1;
const cur=()=>tabs[activeTab]||null;
const curName=()=>cur()?cur().name:'';
const curText=()=>cur()?cur().mdText:'';

// ── 主题颜色 ──
const _TC_DEFAULTS={bg:'#1e1e1e',accent:'#007acc',text:'#e0e0e0',font:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"};
function _tcDim(hex,f){ const n=parseInt(hex.slice(1),16); return '#'+[16,8,0].map(s=>Math.min(255,Math.round(((n>>s)&0xff)*f)).toString(16).padStart(2,'0')).join(''); }
// 亮度（0-1）：决定派生色该往哪个方向调
function _tcLum(hex){ const n=parseInt(hex.slice(1),16); return (0.299*((n>>16)&0xff)+0.587*((n>>8)&0xff)+0.114*(n&0xff))/255; }
// 派生系数：亮背景取倒数（往暗里调），暗背景原样（往亮里调）
function _tcStep(bg,f){ return _tcLum(bg)>0.5 ? 1/f : f; }
// 线性混合：把 hex 朝 to 混 t（0-1）。用于要「加白/加黑」而非缩放的派生色
function _tcMix(hex,to,t){const a=parseInt(hex.slice(1),16),b=parseInt(to.slice(1),16);return '#'+[16,8,0].map(s=>Math.round(((a>>s)&0xff)*(1-t)+((b>>s)&0xff)*t).toString(16).padStart(2,'0')).join('');}
function _tcApply(c){
  const r=document.documentElement.style;
  const sb=_tcStep(c.bg,1.12), st=_tcStep(c.bg,1.25), sd=_tcStep(c.bg,1.3);
  const sbtn=_tcStep(c.bg,1.2), sbtnh=_tcStep(c.bg,1.4), sblk=_tcStep(c.bg,1.08);
  const scode=_tcStep(c.bg,1.2), stdim=_tcStep(c.bg,0.7), stfaint=_tcStep(c.bg,0.55), sc=_tcStep(c.bg,1.6);
  r.setProperty('--color-bg',c.bg);
  r.setProperty('--color-bg-secondary',_tcDim(c.bg,sb));
  r.setProperty('--color-bg-tertiary',_tcDim(c.bg,st));
  r.setProperty('--color-accent',c.accent);
  r.setProperty('--color-accent-dim',_tcDim(c.accent,0.6)); r.setProperty('--color-accent-pale',_tcDim(c.accent,0.35));
  r.setProperty('--color-text',c.text);
  r.setProperty('--color-text-dim',_tcDim(c.text,stdim));
  r.setProperty('--font-ui',c.font||'-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif');
  r.setProperty('--color-border',_tcDim(c.bg,sd));
  r.setProperty('--color-border-accent',c.accent);
  r.setProperty('--color-btn',_tcDim(c.bg,sbtn));
  r.setProperty('--color-btn-hover',_tcDim(c.bg,sbtnh));
  r.setProperty('--color-block-hover',_tcDim(c.bg,sblk));
  r.setProperty('--color-bg-code',_tcDim(c.bg,scode));
  r.setProperty('--color-text-faint',_tcDim(c.text,stfaint));
  r.setProperty('--color-code',_tcDim(c.accent,sc));
  // 分隔线/表格线：往背景的反方向混（暗背景加白，亮背景加黑），保持与原 #555 相近的观感
  const _dark=_tcLum(c.bg)<=0.5;
  r.setProperty('--color-rule',_tcMix(c.bg,_dark?'#ffffff':'#000000',0.3));
  // 链接色：随 accent 走，暗背景提亮、亮背景压暗
  r.setProperty('--color-link',_dark?_tcMix(c.accent,'#ffffff',0.35):_tcMix(c.accent,'#000000',0.25));
  // 调试: 色盘下方显示当前值
  if($('tcDebug')) $('tcDebug').textContent='bg='+c.bg+' accent='+c.accent+' text='+c.text;
}
function _tcSave(){
  const c={bg:$('tcBg').value,accent:$('tcAccent').value,text:$('tcText').value,font:$('tcFont').value};
  localStorage.setItem('mdv-theme',JSON.stringify(c)); _tcApply(c); _tcHex();
}
function _tcHex(){
  if($('tcBgHex')) $('tcBgHex').textContent=$('tcBg').value;
  if($('tcAccentHex')) $('tcAccentHex').textContent=$('tcAccent').value;
  if($('tcTextHex')) $('tcTextHex').textContent=$('tcText').value;
}
(function _tcInit(){
  const s=localStorage.getItem('mdv-theme'); const c=s?JSON.parse(s):_TC_DEFAULTS;
  _tcApply(c); // CSS变量立即生效
  // input value延迟到DOM稳定后
  requestAnimationFrame(()=>{
    $('tcBg').value=c.bg; $('tcAccent').value=c.accent; $('tcText').value=c.text;
    if($('tcFont')) $('tcFont').value=c.font||_TC_DEFAULTS.font;
    $('tcBg').oninput=$('tcAccent').oninput=$('tcText').oninput=_tcSave;
    if($('tcFont')) $('tcFont').onchange=_tcSave;
    $('tcReset').onclick=()=>{ localStorage.removeItem('mdv-theme'); _tcApply(_TC_DEFAULTS); $('tcBg').value=_TC_DEFAULTS.bg; $('tcAccent').value=_TC_DEFAULTS.accent; $('tcText').value=_TC_DEFAULTS.text; if($('tcFont')) $('tcFont').value=_TC_DEFAULTS.font; _tcHex(); };
    $('setBtn').onclick=()=>$('setModal').classList.add('show');
    $('setClose').onclick=()=>$('setModal').classList.remove('show');
    $('setModal').onclick=e=>{ if(e.target===$('setModal')) $('setModal').classList.remove('show'); };
    _tcHex();
  });
})();

// ── 生成唯一 ID ──
function slug(text){text=text.replace(/\x00[A-Z]{2}\d+\x00/g,'');return 'h-'+text.toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g,'-').replace(/^-|-$/g,'')||'h-'+Math.random().toString(36).slice(2,8)}

// ── 生成目录 HTML ──
// v4.7.2: 目录项里的 $...$ 用 KaTeX 渲染后再放进去（否则目录里显示 "$sup$ 的四个等价说法" 这种源码）
function _tocMath(s){
  if(typeof katex==='undefined'||s.indexOf('$')<0) return s;
  return s.replace(/(?<!\\)\$([^$]+?)\$/g,(mm,tex)=>{
    try{return katex.renderToString(tex,{throwOnError:false});}catch(e){return mm;}
  });
}
function buildTOC(html){
  const rx=/<(h[1-6])[^>]*id="([^"]*)"[^>]*>(.+?)<\/h[1-6]>/gi;
  const items=[];
  let m;
  while((m=rx.exec(html))!==null){
    items.push({tag:m[1],id:m[2],html:_tocMath(m[3]),text:m[3].replace(/<[^>]+>/g,'').replace(/\$/g,'')});
  }
  tocList.innerHTML='';
  if(!items.length){
    tocList.innerHTML='<div class="toc-empty">暂无标题</div>';
    tocPanel.classList.remove('visible');
    $('tocBtn').style.display='none';
    headingIds=[];
    return;
  }
  tocPanel.classList.add('visible');
  $('tocBtn').style.display='none';
  headingIds=items.map(i=>i.id);
  items.forEach(item=>{
    const a=document.createElement('a');
    a.className='toc-item';
    a.classList.add('lvl'+item.tag[1]);
    a.innerHTML=item.html;
    a.title=item.text;
    a.href='#'+item.id;
    a.onclick=e=>{
      e.preventDefault();
      document.getElementById(item.id)?.scrollIntoView({behavior:'smooth'});
    };
    tocList.appendChild(a);
  });
  _setupTocHighlight();
  _updateToc();
}

// ── 目录高亮: scroll触发,三层简单逻辑 ──
let _tocHeads=[], _tocRAF=null;
function _setupTocHighlight(){
  _tocHeads=[];
  const links=tocList.querySelectorAll('.toc-item');
  links.forEach(a=>{
    const h=document.getElementById(a.getAttribute('href').slice(1));
    if(h) _tocHeads.push({el:h, a});
  });
}
// 每次renderMD后调用:_setupTocHighlight+_updateToc
function _updateToc(){
  // ① 找视口顶部最近的标题
  let topEl=null, minTop=Infinity;
  _tocHeads.forEach(({el})=>{
    const r=el.getBoundingClientRect();
    if(r.top>=56&&r.top<window.innerHeight&&r.top<minTop){ minTop=r.top; topEl=el; }
  });
  // 全在工具栏上方→取最后一个
  if(!topEl){ for(let i=_tocHeads.length-1;i>=0;i--){ if(_tocHeads[i].el.getBoundingClientRect().bottom<=56){ topEl=_tocHeads[i].el; break; } } }
  if(!topEl&&_tocHeads.length) topEl=_tocHeads[0].el;
  // ② 构建祖先链(当前标题+往前逐级父标题)
  const chain=new Set([topEl]);
  const idx=headingIds.indexOf(topEl.id);
  if(idx>=0){
    let cl=parseInt(topEl.tagName[1]);
    for(let j=idx-1;j>=0;j--){
      const prev=document.getElementById(headingIds[j]);
      const pl=parseInt(prev.tagName[1]);
      if(pl<cl){ chain.add(prev); cl=pl; }
    }
  }
  // ③ 只高亮链上标题
  _tocHeads.forEach(({el,a})=>{ a.classList.toggle('active',chain.has(el)); });
}
preview.addEventListener('scroll',()=>{
  if(_tocRAF) return;
  _tocRAF=requestAnimationFrame(()=>{ _tocRAF=null; _updateToc(); });
},{passive:true});

// ── Markdown 渲染 ──
function renderMD(text){
  let h=text;
  // 先提取代码块，用占位符保护（避免被表格/标题/<p> 包裹正则误伤内部 # 注释）
  const _codeBlocks=[];
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(_,lang,code)=>{
    _codeBlocks.push(code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));
    return `\x00CB${_codeBlocks.length-1}\x00`;
  });
  // v4.7.1: 正文与公式里的裸 < 必须转义成 &lt;。浏览器会把 <x（< 紧跟字母）当成标签开头，
  // 一路吞掉其后直到下一个 > 的所有内容——公式缺半截、整段文字凭空消失。
  // 用户显式写的 HTML 标签先换成占位符保护，最后还原。
  const _htmlTags=[];
  h=h.replace(/<\/?(?:details|summary|br|hr|img|a|div|span|p|strong|em|b|i|u|s|del|ins|mark|kbd|sub|sup|code|pre|blockquote|table|thead|tbody|tr|th|td|ul|ol|li|h1|h2|h3|h4|h5|h6|figure|figcaption|center|small|video|audio|source|svg|path|input|label)(?=[\s\/>])[^>]*>/gi,
    m=>{_htmlTags.push(m);return `\x00HT${_htmlTags.length-1}\x00`;});
  h=h.replace(/</g,'&lt;');
  // v4.7.2: $$...$$ 与行内 $...$ 都在**表格处理之前**提取成占位符。
  // 两个理由：① 表格里的公式会被单元格分隔符 | 切开（如 $|x_n-x|<\varepsilon$ 里的绝对值竖线）；
  // ② 公式里的 * [ ] ` _ 会被后续 markdown 正则误伤（$x^*$ 曾被强调正则拆成一对斜体）。
  const _mathBlocks=[];
  h=h.replace(/\$\$([\s\S]*?)\$\$/g,(m)=>{_mathBlocks.push(m);return `\x00MB${_mathBlocks.length-1}\x00`;});
  const _inlineMath=[];
  h=h.replace(/(?<!\\)\$([^$\n]+?)\$/g,(m)=>{_inlineMath.push(m);return `\x00IM${_inlineMath.length-1}\x00`;});
  // v4.7.3: \$ 是「字面美元」。KaTeX auto-render 找起始 $ 时不看反斜杠，会把 \$5 与同行的
  // 下一个 $ 配成一对，所以这里先把它拆进独立元素，破坏这对配对。
  h=h.replace(/\\\$/g,'<span class="md-lit-dollar">$</span>');
  h=h.replace(/((?:^\|.+\|(?:\n|$))+)/gm,function(block){
    const lines=block.trim().split('\n');
    if(lines.length<2) return block;
    const parseRow=r=>r.split('|').slice(1,-1).map(c=>c.trim());
    const headerCells=parseRow(lines[0]);
    const dataLines=lines.slice(1).filter(l=>!/^\|[-:| ]+\|$/.test(l));
    let html='<table>';
    html+='<thead><tr>'+headerCells.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead>';
    if(dataLines.length){
      html+='<tbody>';
      dataLines.forEach(l=>{
        const cells=parseRow(l);
        while(cells.length<headerCells.length) cells.push('');
        html+='<tr>'+cells.slice(0,headerCells.length).map(c=>'<td>'+c+'</td>').join('')+'</tr>';
      });
      html+='</tbody>';
    }
    html+='</table>';
    return html;
  });
  // v4.7.0: 空行 → 可见空行（敲 N 个空行渲染 N 个空行；代码块/公式块已被占位符保护不受影响）
  h=h.replace(/^[ \t]*\n/gm,'<div class="md-space"></div>\n');
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/^#### (.+)$/gm,(_,t)=>`<h4 id="${slug(t)}">${t}</h4>`);
  h=h.replace(/^### (.+)$/gm,(_,t)=>`<h3 id="${slug(t)}">${t}</h3>`);
  h=h.replace(/^## (.+)$/gm,(_,t)=>`<h2 id="${slug(t)}">${t}</h2>`);
  h=h.replace(/^# (.+)$/gm,(_,t)=>`<h1 id="${slug(t)}">${t}</h1>`);
  h=h.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  h=h.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">');
  h=h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  h=h.replace(/^---$/gm,'<hr>');
  h=h.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>');
  // v4.7.1: 行首是 HTML 标签占位符（\x00HT）时同样不包 <p>，保持 <details> 等块级标签的原行为
  // v4.7.3: 行首是公式块占位符（\x00MB）时不包 <p>——math-block 是块级元素，包了浏览器会多出空段落
  h=h.replace(/^(?!<[a-z]|\x00HT|\x00MB|$)(.+)$/gm,'<p>$1</p>');
  h=h.replace(/<p>\s*<\/p>/g,'');
  // 还原 $$...$$ 公式块（占位符不会被 <p> 包裹破坏）
  h=h.replace(/\x00MB(\d+)\x00/g,(_,i)=>`<div class="math-block">${_mathBlocks[i]}</div>`);
  // v4.7.2: 还原行内公式（**不要**剥外层 <p>——单行公式原本就被包在 <p> 里，剥了会丢段落间距）
  h=h.replace(/\x00IM(\d+)\x00/g,(_,i)=>_inlineMath[i]);
  // 还原代码块（占位符在标题/<p> 正则之后还原，内部的 # 注释不会被误当标题）
  // 占位符可能被 <p> 包裹正则包了一层（<p>\x00CB0\x00</p>），还原时连外层 <p> 一起剥掉
  h=h.replace(/<p>\x00CB(\d+)\x00<\/p>/g,(_,i)=>`<pre><code>${_codeBlocks[i]}</code></pre>`);
  h=h.replace(/\x00CB(\d+)\x00/g,(_,i)=>`<pre><code>${_codeBlocks[i]}</code></pre>`);
  // v4.7.1: 还原用户显式写的 HTML 标签（占位符可能被 <p> 包裹正则包了一层，连外层一起剥）
  h=h.replace(/<p>\x00HT(\d+)\x00<\/p>/g,(_,i)=>_htmlTags[i]);
  h=h.replace(/\x00HT(\d+)\x00/g,(_,i)=>_htmlTags[i]);
  return h;
}

async function loadFile(handle,name){
  const file=await handle.getFile();
  const text=await file.text();
  openDoc(text,name,handle,null);
}

// ══════════════ 块编辑系统 ══════════════

// ── 解析块 ──
function _parseBlocks(text){
  const lines=text.split('\n');
  const blocks=[]; let cur=[];
  function flush(){
    if(cur.length && cur.some(l=>l.trim())){blocks.push(cur.join('\n'));}
    cur=[];
  }
  for(let i=0;i<lines.length;i++){
    const l=lines[i];
    if(/^#{1,4}\s/.test(l)){flush(); cur.push(l); flush();}
    else if(/^---$/.test(l)&&!(lines[i-1]||'').startsWith('|')){flush(); cur.push(l); flush();}
    else cur.push(l);
  }
  flush();
  const out=blocks.filter(b=>b.trim());
  // v4.7.0: 去掉 \n{3,} 压缩——用户敲的空行在保存/重载时不应丢失（渲染层用 md-space 显示）
  // v4.5.0 空文件可编辑：无块时塞一个占位空块
  if(out.length===0) out.push('');
  return out;
}

// ── 渲染块 ──
let _editingIdx=null;
function _renderBlocks(blocks,container){
  container.innerHTML='';
  blocks.forEach((raw,idx)=>{
    const div=document.createElement('div');
    div.className='block';
    div.dataset.idx=idx;
    div.dataset.raw=raw;
    if(raw.trim()==='---') div.innerHTML='<hr>';
    else if(!raw.trim()) div.innerHTML='<span class="empty-hint">空文件 — 双击开始输入</span>';
    else div.innerHTML=renderMD(raw);
    div.ondblclick=()=>_editBlock(idx);
    div.title='双击编辑';
    container.appendChild(div);
  });
  _renderMath(container);
}

function _renderMath(el){
  // 优先用 KaTeX auto-render（CDN 已加载的话）
  if(typeof renderMathInElement==='function'){
    try{renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]})}catch(e){}
    return;
  }
  // 兜底：手动解析 $...$ 和 $$...$$ 用 katex 核心渲染
  if(typeof katex==='undefined') return;
  _manualRender(el);
}

function _manualRender(el){
  // 用 TreeWalker 遍历所有文本节点
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null,false);
  const textNodes=[];
  while(walker.nextNode()) textNodes.push(walker.currentNode);
  
  textNodes.forEach(node=>{
    const text=node.textContent;
    // 检查是否包含 $...$
    if(!text.includes('$')) return;
    
    const parent=node.parentNode;
    const frag=document.createDocumentFragment();
    let remaining=text;
    
    // 先匹配 $$...$$
    const ddRegex=/\$\$([\s\S]*?)\$\$/g;
    // 先处理 display math，替换成占位符
    const displayBlocks=[];
    let ddMatch;
    while((ddMatch=ddRegex.exec(text))!==null){
      displayBlocks.push({idx:ddMatch.index, len:ddMatch[0].length, latex:ddMatch[1], html:null});
    }
    
    // 从后往前替换（保持索引不变）
    let processed=text;
    for(let i=displayBlocks.length-1;i>=0;i--){
      const b=displayBlocks[i];
      try{
        b.html=katex.renderToString(b.latex,{throwOnError:false,displayMode:true});
      }catch(e){b.html='<span style="color:#c44">'+e.message+'</span>';}
      processed=processed.substring(0,b.idx)+'@@DD'+i+'@@'+processed.substring(b.idx+b.len);
    }
    
    // 再匹配 $...$（跳过已处理的 display blocks）
    const inRegex=/\$([^$]+?)\$/g;
    const inlineBlocks=[];
    let inMatch;
    while((inMatch=inRegex.exec(processed))!==null){
      inlineBlocks.push({idx:inMatch.index, len:inMatch[0].length, latex:inMatch[1], html:null});
    }
    for(let i=inlineBlocks.length-1;i>=0;i--){
      const b=inlineBlocks[i];
      try{
        b.html=katex.renderToString(b.latex,{throwOnError:false,displayMode:false});
      }catch(e){b.html='<span style="color:#c44">'+e.message+'</span>';}
      processed=processed.substring(0,b.idx)+'@@IN'+i+'@@'+processed.substring(b.idx+b.len);
    }
    
    // 把占位符替换回 HTML（包裹 data-latex 以便双击回传）
    let result=processed;
    for(let i=0;i<displayBlocks.length;i++){
      result=result.replace('@@DD'+i+'@@','<span class="math-live" data-latex="'+
        displayBlocks[i].latex.replace(/"/g,'&quot;')+'">'+displayBlocks[i].html+'</span>');
    }
    for(let i=0;i<inlineBlocks.length;i++){
      result=result.replace('@@IN'+i+'@@','<span class="math-live" data-latex="'+
        inlineBlocks[i].latex.replace(/"/g,'&quot;')+'">'+inlineBlocks[i].html+'</span>');
    }
    
    // 把文本节点替换为 HTML
    const tmp=document.createElement('span');
    tmp.innerHTML=result;
    while(tmp.firstChild){
      parent.insertBefore(tmp.firstChild,node);
    }
    parent.removeChild(node);
  });
}

// ── 编辑块 ──
function _editBlock(idx){
  if(_editingIdx!==null) _finishEdit();
  const blocks=document.querySelectorAll('.block');
  if(idx>=blocks.length) return;
  const div=blocks[idx];
  const raw=div.dataset.raw;
  const st=preview.scrollTop; // 保存滚动位置
  div.className='block block-editing';
  div.innerHTML='<button class="block-done" id="blockDone">✔ 完成</button><button class="block-tb-toggle" id="blockTbToggle" title="编辑工具">📐</button><button class="block-preview-toggle" id="blockPreviewToggle" title="预览">👁</button><div class="block-edit-split"><textarea class="block-editor"></textarea><div class="block-edit-preview" style="display:none"></div></div>';
  const ta=div.querySelector('.block-editor');
  const pv=div.querySelector('.block-edit-preview');
  ta.value=raw;
  _editingIdx=idx;
  ta.focus();
  _autoSizeTA(ta);
  _bindScrollSync(ta, pv);
  preview.scrollTop=st; // 恢复滚动位置
  // 工具栏不自动弹出，由📐按钮切换
  // 完成按钮
  const doneBtn=document.getElementById('blockDone');
  if(doneBtn) doneBtn.onclick=(e)=>{e.stopPropagation();_finishEdit();};
  const tbBtn=document.getElementById('blockTbToggle');
  if(tbBtn) tbBtn.onclick=(e)=>{e.stopPropagation();_toggleTb();};
  const pvBtn=document.getElementById('blockPreviewToggle');
  if(pvBtn) pvBtn.onclick=(e)=>{e.stopPropagation();_togglePreview();};
  // 键盘
  ta.onkeydown=(e)=>{
    if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart;ta.value=ta.value.substring(0,s)+'  '+ta.value.substring(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=s+2;}
    if(e.key==='Escape'){e.preventDefault();_finishEdit();}
    if(e.key==='Enter'&&e.ctrlKey){e.preventDefault();_finishEdit();}
    if(e.key==='Enter'&&_handleTableEnter(ta)){e.preventDefault();}
  };
  ta.oninput=()=>{_autoSizeTA(ta);_livePreview()};
  ta.addEventListener('click',()=>_canvasLatex&&_livePreview());
  ta.addEventListener('keyup',(e)=>{
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown'].includes(e.key))
      _canvasLatex&&_livePreview();
  });
  _livePreview();
}

function _autoSizeTA(ta){
  ta.style.height='auto';
  ta.style.height=Math.min(480,Math.max(80,ta.scrollHeight))+'px';
  // 同步分屏预览高度
  const pv=document.querySelector('.block-edit-preview');
  if(pv) pv.style.maxHeight=ta.style.height;
}

function _finishEdit(){
  if(_editingIdx===null) return;
  const idx=_editingIdx; // 捕获当前索引
  const blocks=document.querySelectorAll('.block');
  const div=blocks[idx];
  if(!div) return;
  const ta=div.querySelector('.block-editor');
  if(ta){
    const newRaw=ta.value;
    div.dataset.raw=newRaw;
    if(newRaw.trim()==='---') div.innerHTML='<hr>';
    else div.innerHTML=renderMD(newRaw);
    div.className='block';
    div.ondblclick=()=>_editBlock(idx);
    div.title='双击编辑';
    _updateFullText();
    // 重渲染整个预览区的数学公式（确保所有块都被处理）
    _renderMath(preview);
  }
  _editingIdx=null;
  _canvasLatex=''; feClear(); // 结束编辑，清canvas
  _hideTb();
}

function _updateFullText(){
  const blocks=document.querySelectorAll('.block');
  let full='';
  blocks.forEach((b,i)=>{
    if(i>0) full+='\n';
    full+=b.dataset.raw;
  });
  const t=cur();
  if(t){
    if(t.mdText!==full){t.mdText=full;t.dirty=true;renderTabBar();}
    preview.dataset.mdText=full;
  }
}

// ── 滚动追踪: 编辑框↔预览按比例双向同步 ──
function _bindScrollSync(ta, pv){
  if(!ta||!pv) return;
  let lock=false;
  const range=el=>Math.max(1,el.scrollHeight-el.clientHeight);
  const sync=(from,to)=>{
    const r=from.scrollTop/range(from);
    to.scrollTop=r*range(to);
  };
  ta.addEventListener('scroll',()=>{
    if(lock||pv.style.display==='none') return;
    lock=true; sync(ta,pv); lock=false;
  },{passive:true});
  pv.addEventListener('scroll',()=>{
    if(lock) return;
    lock=true; sync(pv,ta); lock=false;
  },{passive:true});
  // 显示预览时同步一次当前位置
  const show=pv.style.display;
  pv.style.display='';
  sync(ta,pv);
  pv.style.display=show;
}

// ── 实时预览 ──
function _livePreview(){
  const ta=document.querySelector('.block-editor');
  // 优先渲染到分屏编辑的预览区，否则回退到tbPreview
  let pv=document.querySelector('.block-edit-preview');
  if(!pv) pv=$('tbPreview');
  if(!ta||!pv) return;
  pv.innerHTML='';
  // 合并编辑框文本 + canvas公式（优先替换点击来源的原文公式，否则插入光标位置）
  let md=ta.value;
  if(_canvasLatex){
    const wrapped='$'+_canvasLatex+'$';
    let s, e;
    if(_replaceRange && _replaceRange.s>=0 && _replaceRange.e<=md.length){
      s=_replaceRange.s; e=_replaceRange.e;   // 点击公式场景：替换原文中的旧公式
    }else{
      s=ta.selectionStart||md.length; e=s;     // 手动构建场景：插入光标位置
    }
    // 防$粘连
    let prefix='', suffix='';
    if(s>0 && md[s-1]==='$') prefix=' ';
    if(e<md.length && md[e]==='$') suffix=' ';
    md=md.substring(0,s)+prefix+wrapped+suffix+md.substring(e);
  }
  const html=renderMD(md);
  pv.innerHTML=html;
  _renderMath(pv);
  // v4.1: 双击渲染公式→载入canvas编辑
  pv.onclick=function(e){
    const math=e.target.closest('.math-live, .katex');
    if(!math) return;
    const latex=_getFormulaLatex(math);
    if(latex){ e.stopPropagation(); feLoadLatex(latex); }
  };
}

// ── v4.5.0 标签栏 ──
function renderTabBar(){
  tabBar.innerHTML='';
  tabs.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='tab'+(i===activeTab?' active':'');
    el.title=t.filePath||t.name;
    el.innerHTML='<span class="tab-name">'+esc(t.name)+'</span>'+(t.dirty?'<span class="tab-dirty">●</span>':'')+'<span class="tab-close">✕</span>';
    el.onclick=(e)=>{
      if(e.target.classList.contains('tab-close')){closeTab(i);return;}
      switchTab(i);
    };
    el.ondblclick=(e)=>{
      e.stopPropagation();
      if(e.target.classList.contains('tab-close')) return;
      renameTab(i);
    };
    el.addEventListener('mousedown',e=>e.preventDefault()); // 防拖选文字
    tabBar.appendChild(el);
  });
  const add=document.createElement('div');
  add.className='tab-new';
  add.textContent='+';
  add.title='新建文件 (Ctrl+N)';
  add.onclick=()=>newTab();
  tabBar.appendChild(add);
  // 无文件时显示 dropZone，有文件时显示预览
  if(tabs.length===0){previewWrap.style.display='none';dropZone.style.display='';}
  else{previewWrap.style.display='block';dropZone.style.display='none';}
}
// v4.6.0 重命名标签：双击标签进入编辑，Enter/失焦保存
function renameTab(i){
  const t=tabs[i]; if(!t) return;
  const el=tabBar.children[i]; if(!el) return;
  const nameEl=el.querySelector('.tab-name');
  const oldName=t.name;
  // 替换为输入框
  const input=document.createElement('input');
  input.type='text';
  input.className='tab-rename';
  input.value=oldName.replace(/\.md$/,'');
  input.title='重命名，Enter 确认，Esc 取消';
  nameEl.replaceWith(input);
  input.focus();
  input.select();
  let done=false;
  const finish=async(save)=>{
    if(done) return; done=true;
    if(save){
      let newName=input.value.trim();
      if(!newName){renderTabBar();return;}
      if(!/\.md$/i.test(newName)) newName+='.md'; // 自动补 .md 防文件树消失
      const okR=await _doRename(t,oldName,newName);
      if(okR){ t.name=newName; if(t.filePath) t.filePath=okR.newPath||t.filePath; }
    }
    renderTabBar();
    if(save&&_editingIdx!==null){} // no-op
  };
  input.onkeydown=async e=>{
    if(e.key==='Enter'){e.preventDefault();await finish(true);}
    if(e.key==='Escape'){e.preventDefault();finish(false);}
  };
  input.onblur=()=>{finish(true);};
  // 点击别处不立即失焦（给 blur 处理时间）
  input.addEventListener('mousedown',e=>e.stopPropagation());
}
// 磁盘重命名：fileHandle.move 优先，filePath 走 /api/rename，未保存文件仅改标签
async function _doRename(t,oldName,newName){
  try{
    if(t.fileHandle&&typeof t.fileHandle.move==='function'){
      const newHandle=await t.fileHandle.move(newName);
      t.fileHandle=newHandle;
      return {newPath:null};
    }
    if(t.filePath){
      const dir=t.filePath.substring(0,t.filePath.lastIndexOf('\\')+1);
      const resp=await fetch('/api/rename',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({oldPath:t.filePath, newPath:dir+newName})
      });
      const d=await resp.json();
      if(d.error) throw new Error(d.error);
      return {newPath:d.newPath};
    }
    // 未保存新文件：仅改标签名（保存时用新名）
    return {newPath:null};
  }catch(e){
    alert('重命名失败: '+e.message);
    return null;
  }
}
function switchTab(i){
  if(i===activeTab) return;
  if(_editingIdx!==null) _finishEdit();
  activeTab=i;

function closeTab(i){
  const t=tabs[i]; if(!t) return;
  if(t.dirty&&!confirm('「'+t.name+'」有未保存的修改，关闭将丢失。确定关闭？')) return;
  if(_editingIdx!==null&&i===activeTab) _finishEdit();
  tabs.splice(i,1);
  if(activeTab>=tabs.length) activeTab=tabs.length-1;
  else if(i<activeTab) activeTab--;
  renderTabBar();
  if(activeTab>=0){
    const c=cur();
    _showPreview(c.mdText,c.name); pathBar.textContent=c.name;
  }else{

}
function newTab(){
  if(_editingIdx!==null) _finishEdit();
  let n=1;
  const names=tabs.map(t=>t.name);
  while(names.includes('未命名 '+n+'.md')) n++;
  tabs.push({name:'未命名 '+n+'.md', mdText:'', fileHandle:null, filePath:null, dirty:true});
  activeTab=tabs.length-1;

}
// 打开文件（文件树/拖放/URL 共用）：已在 tabs 则切换，否则新建
function openDoc(text,name,fileHandle,filePath){
  if(_editingIdx!==null) _finishEdit();
  // 已在 tabs 中 → 切换过去
  for(let i=0;i<tabs.length;i++){
    if(tabs[i].name===name&&tabs[i].filePath===filePath&&tabs[i].fileHandle===fileHandle){
      activeTab=i; renderTabBar();
      const t=cur(); _showPreview(t.mdText,t.name); pathBar.textContent=t.name;
      return;
    }
  }
  tabs.push({name, mdText:text, fileHandle:fileHandle||null, filePath:filePath||null, dirty:false});
  activeTab=tabs.length-1;
  renderTabBar();

}

function _insertTable(cols,rows){
  const ta=document.querySelector('.block-editor'); if(!ta) return;
  let t='\n';
  t+='|'+' 列 |'.repeat(cols)+'\n';
  t+='|'+'---|'.repeat(cols)+'\n';
  for(let r=0;r<rows;r++) t+='|'+'  |'.repeat(cols)+'\n';
  const s=ta.selectionStart;
  ta.value=ta.value.substring(0,s)+t+ta.value.substring(s);
  ta.selectionStart=ta.selectionEnd=s+4; // 光标放在第一个单元格
  ta.focus(); _autoSizeTA(ta); _livePreview();
}

// ── 标题切换 ──
function _toggleHeading(){
  const ta=document.querySelector('.block-editor'); if(!ta) return;
  const lineStart=ta.value.lastIndexOf('\n',ta.selectionStart-1)+1;
  const lineEnd=ta.value.indexOf('\n',ta.selectionStart);
  const actualEnd=lineEnd<0?ta.value.length:lineEnd;
  const oldLine=ta.value.substring(lineStart,actualEnd);
  let newLine;
  if(oldLine.startsWith('#### ')) newLine=oldLine.replace('#### ','');
  else if(oldLine.startsWith('### ')) newLine=oldLine.replace('### ','#### ');
  else if(oldLine.startsWith('## ')) newLine=oldLine.replace('## ','### ');
  else if(oldLine.startsWith('# ')) newLine=oldLine.replace('# ','## ');
  else newLine='# '+oldLine;
  ta.value=ta.value.substring(0,lineStart)+newLine+ta.value.substring(actualEnd);
  ta.selectionStart=ta.selectionEnd=lineStart+newLine.length;
  ta.focus(); _livePreview();
}

// ── 列表 ──
function _addListPrefix(){
  const ta=document.querySelector('.block-editor'); if(!ta) return;
  const lineStart=ta.value.lastIndexOf('\n',ta.selectionStart-1)+1;
  const before=ta.value.substring(0,lineStart);
  const after=ta.value.substring(lineStart);
  if(after.startsWith('- ')){// 取消列表
    ta.value=before+after.substring(2);
    ta.selectionStart=ta.selectionEnd=lineStart;
  }else{
    ta.value=before+'- '+after;
    ta.selectionStart=ta.selectionEnd=lineStart+2;
  }
  ta.focus(); _livePreview();
}

// ── 表格 Enter 自动加行 ──
function _handleTableEnter(ta){
  const before=ta.value.substring(0,ta.selectionStart);
  const after=ta.value.substring(ta.selectionStart);
  const lastLine=before.substring(before.lastIndexOf('\n')+1);
  if(!lastLine.startsWith('|')||!lastLine.endsWith('|')) return false;
  // 统计列数（数 | 的数量 - 1）
  const cols=(lastLine.match(/\|/g)||[]).length-1;
  if(cols<1) return false;
  let newRow='|'+'  |'.repeat(cols);
  ta.value=before+'\n'+newRow+after;
  ta.selectionStart=ta.selectionEnd=before.length+3;
  _autoSizeTA(ta); _livePreview();
  return true;
}

function _insertSymbol(latex){
  const ta=document.querySelector('.block-editor');
  if(!ta) return;
  const s=ta.selectionStart, e=ta.selectionEnd;
  const before=ta.value.substring(0,s);
  const sc=(before.match(/(^|[^$])\$(?!\$)/g)||[]).length;
  const inMath=sc%2===1;
  let ins=latex;
  if(!inMath) ins='$'+ins+'$';
  ta.value=before+ins+ta.value.substring(e);
  // 光标跳到第一个 {} 中间
  const cp=ins.indexOf('{}');
  const np=s+(cp>=0?cp+1:ins.length);
  ta.selectionStart=ta.selectionEnd=np;
  ta.focus();
  _autoSizeTA(ta);
  _livePreview();
}

async function saveFile(){
  if(_editingIdx!==null) _finishEdit();
  const t=cur(); if(!t) return;
  _checkMathDelimiters(t.mdText);
  if($('pathBar')&&$('pathBar').textContent.includes('⚠️')){
    const n=($('pathBar').title.match(/\d+/g)||[]).length;
    if(n&&!confirm('有 '+n+' 行 $ 不成对，确定保存？')) return;
  }
  // 新文件（无路径无 handle）→ 另存为
  if(!t.filePath&&!t.fileHandle){
    await saveAsNewFile();
    return;
  }
  if(t.filePath){
    try{
      const resp = await fetch('/api/write', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({path:t.filePath, content:t.mdText})
      });
      const d=await resp.json();
      if(d.error) throw new Error(d.error);
      t.dirty=false; renderTabBar();
      pathBar.textContent=t.name+' ✓已保存';
      setTimeout(()=>{pathBar.textContent=t.name},2000);
    }catch(e){alert('保存失败: '+e.message);}
    return;
  }
  if(t.fileHandle._ro){   // v4.8.3: 只读打开的（拖入文件夹的降级模式）→ 不能写回原文件
    alert('这个文件是以「只读方式」打开的（拖入文件夹的降级模式），没法直接写回原文件。\n将用「另存为」保存一份。\n想要可读写：请用「打开文件夹」按钮重新打开这个文件夹。');
    await saveAsNewFile();
    return;
  }
  try{
    const writable=await t.fileHandle.createWritable();
    await writable.write(t.mdText);
    await writable.close();
    t.dirty=false; renderTabBar();
    pathBar.textContent=t.name+' ✓已保存';
    setTimeout(()=>{pathBar.textContent=t.name},2000);
  }catch(e){alert('保存失败: '+e.message);}
}
// 新文件另存为：showSaveFilePicker 优先，失败则下载
async function saveAsNewFile(){
  const t=cur(); if(!t) return;
  try{
    if(typeof showSaveFilePicker==='function'){
      const handle=await showSaveFilePicker({
        suggestedName:t.name||'document.md',
        types:[{description:'Markdown',accept:{'text/markdown':['.md','.markdown']}}]
      });
      const writable=await handle.createWritable();
      await writable.write(t.mdText);
      await writable.close();
      t.fileHandle=handle; t.filePath=null; t.dirty=false;
      pathBar.textContent=t.name+' ✓已保存';
      setTimeout(()=>{pathBar.textContent=t.name},2000);
      renderTabBar();
      return;
    }
  }catch(e){
    if(e.name==='AbortError') return; // 用户取消
    alert('另存为失败: '+e.message);
    return;
  }
  // 兜底：下载
  const blob=new Blob([t.mdText],{type:'text/markdown'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=t.name||'document.md';
  a.click();
  URL.revokeObjectURL(a.href);
  t.dirty=false; renderTabBar();
}

// ── 目录树 ──
function buildTree(container,entries,basePath=''){
  const folders=[], files=[];
  for(const [name,handle] of entries){
    if(handle.kind==='directory') folders.push([name,handle]);
    else if(name.endsWith('.md')) files.push([name,handle]);
  }
  folders.sort((a,b)=>a[0].localeCompare(b[0]));
  files.sort((a,b)=>a[0].localeCompare(b[0]));
  for(const [name,handle] of folders){
    const row=document.createElement('div');
    row.className='tree-item folder';
    row.innerHTML=`<span class="arrow">▶</span><span class="icon">📁</span><span class="name">${esc(name)}</span>`;
    const children=document.createElement('div');
    children.className='tree-children hidden';
    row.onclick=async(e)=>{
      e.stopPropagation();
      const arrow=row.querySelector('.arrow');
      if(children.classList.contains('hidden')){
        if(!children.dataset.loaded){
          children.textContent='加载中...';
          try{
            const sub=await iterToMap(handle);
            children.textContent='';
            buildTree(children,sub,basePath+name+'/');
            children.dataset.loaded='1';
          }catch(err){children.textContent='读取失败';}
        }
        children.classList.remove('hidden');
        arrow.classList.add('expanded');
      }else{
        children.classList.add('hidden');
        arrow.classList.remove('expanded');
      }
    };
    container.appendChild(row);
    container.appendChild(children);
  }
  for(const [name,handle] of files){
    const row=document.createElement('div');
    row.className='tree-item file';
    row.innerHTML=`<span style="width:14px"></span><span class="icon">📄</span><span class="name">${esc(name)}</span>`;
    row.onclick=async(e)=>{
      e.stopPropagation();
      if(activeEl) activeEl.classList.remove('active');
      activeEl=row;
      row.classList.add('active');
      await loadFile(handle,basePath+name);
    };
    container.appendChild(row);
  }
}

// v4.8.3: 只读文件夹支持——把 webkitGetAsEntry 的 FileSystemDirectoryEntry
// 包装成 FileSystemHandle 的形状（kind/name/values/getFile），复用 buildTree/loadFile。
// 用途：拖入文件夹时若拿不到可读写句柄（getAsFileSystemHandle 返回 null/超时），降级用。
function _roReadEntries(dirEntry){
  return new Promise((res,rej)=>{
    const rd=dirEntry.createReader(); const all=[];
    const step=()=>rd.readEntries(batch=>{ if(!batch.length) return res(all); all.push(...batch); step(); }, rej);
    step();
  });
}
function _roFile(entry){
  return { kind:'file', name:entry.name, _ro:true,
    getFile:()=>new Promise((res,rej)=>entry.file(res,rej)) };
}
function _roDir(entry){
  return { kind:'directory', name:entry.name, _ro:true,
    async *values(){
      for(const it of await _roReadEntries(entry)) yield it.isDirectory? _roDir(it) : _roFile(it);
    } };
}

async function iterToMap(dirHandle){
  const map=new Map();
  for await(const entry of dirHandle.values()) map.set(entry.name,entry);
  return map;
}

  }
}

async function refreshTree(){

function saveHandle(handle){
  const req=indexedDB.open('mdViewerDB',2);
  req.onupgradeneeded=()=>{req.result.createObjectStore('handles');};
  req.onsuccess=()=>{
    const tx=req.result.transaction('handles','readwrite');
    tx.objectStore('handles').put(handle,'dirHandle');
  };
}
async function restoreHandle(){
  return new Promise(resolve=>{
    const req=indexedDB.open('mdViewerDB',2);
    req.onupgradeneeded=()=>{req.result.createObjectStore('handles');};
    req.onsuccess=async()=>{
      const tx=req.result.transaction('handles','readonly');
      const get=tx.objectStore('handles').get('dirHandle');
      get.onsuccess=async()=>{
        const h=get.result;
        if(h){
          const opts={mode:'readwrite'};
          const ok=(await h.queryPermission(opts)==='granted')||(await h.requestPermission(opts)==='granted');
          if(ok){dirHandle=h;await refreshTree();resolve(true);return}
        }
        resolve(false);
      };
      get.onerror=()=>resolve(false);
    };
  });
}

// ── $ 检查 ──
function _checkMathDelimiters(text){
  if(!text) return;
  const lines=text.split('\n');
  let warn=[];
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(!line.includes('$')) continue;
    const dds=line.match(/\$\$/g);
    const ds=line.match(/(?<![\\$])\$(?!\$)/g);
    const ddCnt=dds?dds.length*2:0;
    const dCnt=ds?ds.length:0;
    if((ddCnt+dCnt)%2!==0) warn.push((i+1)+': '+line.trim().substring(0,40));
  }
  if(warn.length){
    pathBar.textContent=curName()+' ⚠️ '+(warn.length)+'行 $ 不成对';
    pathBar.title=warn.join('\n');
  }
}

document.body.ondrop=async e=>{
  e.preventDefault();
  preview.style.outline=''; try{dropZone.style.outline=''}catch(_){}
  const dt=e.dataTransfer;
  if(!dt) return;
  // v4.8.4: ⚠️ 必须在任何 await 之前【同步快照】——drop 处理器一旦 await，
  // 浏览器会把 dataTransfer.items / files 清空（protected mode），
  // 后续所有读取（含下面的 entry 降级）都会拿到空数组。
  const filesSnap=[...dt.files];
  const itemsSnap=[...dt.items].map(it=>{
    let entry=null;
    try{ entry=it.webkitGetAsEntry? it.webkitGetAsEntry():null; }catch(_){}
    return {item:it, entry};
  });
  // ① 普通 .md 文件：直接打开（最可靠的一条路，不依赖文件系统句柄）
  const files=filesSnap.filter(f=>f.name.endsWith('.md')||f.name.endsWith('.markdown')||f.type==='text/markdown');
  if(files.length){
    const text=await files[0].text();
    openDoc(text,files[0].name,null,null);
    return;
  }
  const diag=[];
  const sidebarOut=()=>{const s=$('sidebar'); if(s&&s.classList.contains('collapsed')){s.classList.remove('collapsed');$('sideToggle').textContent='◀';}};
  // ② 可读写句柄（File System Access），带超时防止 Promise 挂起
  for(const {item} of itemsSnap){
    if(!item||item.kind!=='file'||typeof item.getAsFileSystemHandle!=='function'){diag.push('无句柄API');continue;}
    let handle=null, err='';
    try{
      handle=await Promise.race([
        item.getAsFileSystemHandle(),
        new Promise(r=>setTimeout(()=>r(null),800))
      ]);
    }catch(ex){ err=(ex&&ex.name||'')+':'+String((ex&&ex.message)||'').slice(0,50); }
    if(handle&&handle.kind==='directory'){dirHandle=handle;saveHandle(dirHandle);await refreshTree();sidebarOut();return}
    diag.push('句柄='+(handle?handle.kind:'null')+(err?'('+err+')':''));
  }
  // ③ 降级：webkitGetAsEntry（快照好的）以【只读】方式打开文件夹
  for(const {entry} of itemsSnap){
    if(entry&&entry.isDirectory){
      dirHandle=_roDir(entry);
      await refreshTree();
      sidebarOut();
      pathBar.textContent=entry.name+'（只读）';
      return;
    }
    diag.push('entry='+(entry?((entry.isDirectory?'dir':'file')+':'+entry.name):'null'));
  }
  // ④ 都没成 → 明确告诉用户怎么办（附诊断，便于排查）
  alert('没识别到可打开的内容。\n（' + (diag.join(' / ')||'dataTransfer 里没有可用项') + '）\n\n· 拖 .md 文件：直接打开\n· 要整个文件夹（笔记目录）：请点上方「打开文件夹」按钮选择（推荐，可读写）');
};
