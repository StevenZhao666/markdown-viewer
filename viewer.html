// 槽位
let _focusedSlot=null;
let _canvasLatex='';
let _replaceRange=null; // v4.1: 预览加载公式的原文位置 {s,e}
// v4.1.10: 槽位双面——编辑层(下)+预览层(上,pointer-events穿透)
// 点击直接穿透预览层到编辑层，浏览器原生聚焦

// ═══════════════ v4.3.0 公式编辑器重构 ═══════════════
// 单一数据源: 公式 = 一棵对象树(feTree)。渲染=树→DOM, 序列化=树→LaTeX
// 点击任意节点(含子节点)→该节点局部转源码编辑→失焦解析回树→重渲染
// 节点: {type, ...}
//   text        {type:'text', value}
//   placeholder {type:'placeholder'}              占位符(?)
//   frac        {type:'frac', num:[], den:[]}
//   sqrt        {type:'sqrt', body:[]}
//   subsup      {type:'subsup', base:[], sup:[], sub:[]}
//   int         {type:'int', from:[], to:[], body:[]}
//   sum         {type:'sum', sym:'Σ'|'Π', from:[], to:[], body:[]}
//   lim         {type:'lim', from:[], body:[]}
let feTree=[];                 // 根序列(节点数组)
let _feEditingPath=null;       // 当前编辑的节点路径(数组), null=未编辑
let _feFocusedPath=null;       // v4.8.0: 选中的槽位/节点路径(数组) —— 点模板会插到这里, 键盘可直输

// ── LaTeX → 树 (递归下降解析, 精简版) ──
function feParse(latex){
  let s=(latex||'').trim();
  if(s.startsWith('$$')&&s.endsWith('$$')) s=s.slice(2,-2);
  else if(s.startsWith('$')&&s.endsWith('$')) s=s.slice(1,-1);
  s=s.trim(); if(!s) return [];
  const nodes=[]; let i=0;
  function skip(){while(i<s.length&&/\s/.test(s[i]))i++;}
  function braced(){
    if(s[i]!=='{') return null;
    let d=1,j=i+1;
    while(j<s.length&&d>0){if(s[j]==='{')d++;else if(s[j]==='}')d--;j++;}
    const r=s.substring(i+1,j-1); i=j; return r;
  }
  function group(str){
    const savedS=s,savedI=i; s=str; i=0;
    const arr=[]; while(i<s.length) one(arr);
    const r=arr; s=savedS; i=savedI; return r;
  }
  function scripts(arr){
    // 处理 ^ _ 后缀
    skip();
    if(s[i]==='^'||s[i]==='_'){
      const kind=s[i]==='^'?'sup':'sub'; i++;
      skip(); let argStr=braced();
      if(argStr===null){ argStr=s[i]||''; if(argStr&&argStr!=='{') i++; }
      const kids=argStr?group(argStr):[];
      const prev=arr[arr.length-1];
      if(prev&&(prev.type==='subsup')){
        prev[kind]=kids;
      }else if(prev&&(prev.type==='text'||prev.type==='placeholder')){
        arr[arr.length-1]={type:'subsup',base:[prev],sup:kind==='sup'?kids:[],sub:kind==='sub'?kids:[]};
      }else if(prev&&(prev.type==='frac'||prev.type==='sqrt'||prev.type==='int'||prev.type==='sum'||prev.type==='lim'||prev.type==='subsup')){
        // 结构节点后跟上标: 新建subsup挂在结构后
        arr[arr.length-1]={type:'subsup',base:[prev],sup:kind==='sup'?kids:[],sub:kind==='sub'?kids:[]};
      }else{
        arr.push({type:'subsup',base:[],sup:kind==='sup'?kids:[],sub:kind==='sub'?kids:[]});
      }
    }
  }
  function one(arr){
    skip(); if(i>=s.length) return;
    const ch=s[i];
    if(ch==='{'){
      const inner=braced(); const kids=inner?group(inner):[];
      arr.push(...kids); scripts(arr); return;
    }
    if(ch==='\\'){
      const m=/^\\(frac|sqrt|int|sum|prod|lim|binom)\*?/.exec(s.slice(i));
      if(m){
        i+=m[0].length; skip();
        const cmd=m[1];
        if(cmd==='frac'){
          const n=braced(),d=braced();
          arr.push({type:'frac',num:n?group(n):[{type:'placeholder'}],den:d?group(d):[{type:'placeholder'}]});
          scripts(arr); return;
        }
        if(cmd==='binom'){
          const t=braced(),b=braced();
          arr.push({type:'binom',top:t?group(t):[{type:'placeholder'}],bottom:b?group(b):[{type:'placeholder'}]});
          scripts(arr); return;
        }
        if(cmd==='sqrt'){
          const b=braced();
          arr.push({type:'sqrt',body:b?group(b):[{type:'placeholder'}]});
          scripts(arr); return;
        }
        if(cmd==='int'){
          const f=braced(),t=braced(),b=braced();
          arr.push({type:'int',from:f?group(f):[{type:'placeholder'}],to:t?group(t):[{type:'placeholder'}],body:b?group(b):[{type:'placeholder'}]});
          scripts(arr); return;
        }
        if(cmd==='sum'||cmd==='prod'){
          const f=braced(),t=braced(),b=braced();
          arr.push({type:'sum',sym:cmd==='sum'?'Σ':'Π',from:f?group(f):[{type:'placeholder'}],to:t?group(t):[{type:'placeholder'}],body:b?group(b):[{type:'placeholder'}]});
          scripts(arr); return;
        }
        if(cmd==='lim'){
          const f=braced(),b=braced();
          arr.push({type:'lim',from:f?group(f):[{type:'placeholder'}],body:b?group(b):[{type:'placeholder'}]});
          scripts(arr); return;
        }
      }
      const t=/\\[a-zA-Z]+|\\[^a-zA-Z]/.exec(s.slice(i));
      if(t){ i+=t[0].length; arr.push({type:'text',value:t[0]}); scripts(arr); return; }
    }
    if(ch==='^'||ch==='_'){
      const kind=ch==='^'?'sup':'sub'; i++; skip();
      let argStr=braced();
      if(argStr===null){ argStr=s[i]||''; if(argStr&&argStr!=='{') i++; }
      const kids=argStr?group(argStr):[];
      arr.push({type:'subsup',base:[],sup:kind==='sup'?kids:[],sub:kind==='sub'?kids:[]});
      return;
    }
    if(ch==='?'){
      i++; arr.push({type:'placeholder'}); scripts(arr); return;
    }
    const t=/[a-zA-Z0-9πΣΠ∫√∞=+\-×÷<>≤≥±·.,;:]+/.exec(s.slice(i));
    if(t){ i+=t[0].length; arr.push({type:'text',value:t[0]}); scripts(arr); return; }
    i++; arr.push({type:'text',value:ch}); scripts(arr);
  }
  while(i<s.length) one(nodes);
  return nodes;
}

// ── 树 → LaTeX (递归序列化, 每层默认值防undefined) ──
function feTreeToLatex(nodes){
  return nodes.map(n=>{
    switch(n.type){
      case 'text': return n.value||'';
      case 'placeholder': return '';   // v4.8.1: 空槽不输出 '?', 渲染成空位
      case 'frac': return '\\frac{'+(feTreeToLatex(n.num||[]))+'}{'+(feTreeToLatex(n.den||[]))+'}';
      case 'binom': return '\\binom{'+(feTreeToLatex(n.top||[]))+'}{'+(feTreeToLatex(n.bottom||[]))+'}';
      case 'sqrt': return '\\sqrt{'+(feTreeToLatex(n.body||[]))+'}';
      case 'subsup':
        return feTreeToLatex(n.base||[])+(n.sup&&n.sup.length?'^{'+feTreeToLatex(n.sup)+'}':'')+(n.sub&&n.sub.length?'_{'+feTreeToLatex(n.sub)+'}':'');
      case 'int': return '\\int'+(n.from&&n.from.length?'_{'+feTreeToLatex(n.from)+'}':'')+(n.to&&n.to.length?'^{'+feTreeToLatex(n.to)+'}':'')+'{'+feTreeToLatex(n.body||[])+'}';
      case 'sum': return '\\'+(n.sym==='Π'?'prod':'sum')+(n.from&&n.from.length?'_{'+feTreeToLatex(n.from)+'}':'')+(n.to&&n.to.length?'^{'+feTreeToLatex(n.to)+'}':'')+'{'+feTreeToLatex(n.body||[])+'}';
      case 'lim': return '\\lim'+(n.from&&n.from.length?'_{'+feTreeToLatex(n.from)+'}':'')+'{'+feTreeToLatex(n.body||[])+'}';
      case 'mtx': return feMtxLatex(n);
      default: return '';
    }
  }).join('');
}
function _feSub(nodes,path){ let cur=nodes; for(const i of path){ if(!cur[i]) return null; cur=cur[i]; } return cur; }
function _feParentPath(nodes,path){ const p=path.slice(0,-1); const last=path[path.length-1]; return {parent:_feSub(nodes,p)||nodes, idx:last, ppath:p}; }

// ── 树 → DOM (递归渲染, 每个节点可点击, data-path) ──
function _feEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function feNodeHTML(node,path){
  const p=path.join('.');
  const editCls=_feEditingPath&&_feEditingPath.join('.')===p?' fe-editing':'';
  const click='onclick="event.stopPropagation();feFocusNode(\''+p+'\')" ondblclick="event.stopPropagation();feEditNode(\''+p+'\')"';
  switch(node.type){
    case 'text': return '<span class="fe-node fe-text" data-path="'+p+'" '+click+'>'+_feEsc(node.value)+'</span>';
    case 'placeholder': return '<span class="fe-node fe-ph" data-path="'+p+'" '+click+' title="单击选中·再点模板可嵌套 / 双击输入"></span>';
    case 'frac':
      return '<span class="fe-node fe-frac" data-path="'+p+'" '+click+'><span class="fe-frac-num">'+(node.num||[]).map((c,i)=>feNodeHTML(c,path.concat('num',i))).join('')+'</span><div class="fe-frac-line"></div><span class="fe-frac-den">'+(node.den||[]).map((c,i)=>feNodeHTML(c,path.concat('den',i))).join('')+'</span></span>';
    case 'binom':
      return '<span class="fe-node fe-binom" data-path="'+p+'" '+click+'><span class="fe-binom-paren">(</span><span class="fe-binom-stack"><span class="fe-binom-top">'+(node.top||[]).map((c,i)=>feNodeHTML(c,path.concat('top',i))).join('')+'</span><span class="fe-binom-bot">'+(node.bottom||[]).map((c,i)=>feNodeHTML(c,path.concat('bottom',i))).join('')+'</span></span><span class="fe-binom-paren">)</span></span>';
    case 'sqrt':
      return '<span class="fe-node fe-sqrt" data-path="'+p+'" '+click+'><span class="fe-sqrt-sign">√</span><span class="fe-sqrt-overline">'+(node.body||[]).map((c,i)=>feNodeHTML(c,path.concat('body',i))).join('')+'</span></span>';
    case 'subsup':
      return '<span class="fe-node fe-subsup" data-path="'+p+'" '+click+'><span class="fe-subsup-base">'+(node.base||[]).map((c,i)=>feNodeHTML(c,path.concat('base',i))).join('')+'</span>'+(node.sup&&node.sup.length?'<sup class="fe-subsup-sup">'+node.sup.map((c,i)=>feNodeHTML(c,path.concat('sup',i))).join('')+'</sup>':'')+(node.sub&&node.sub.length?'<sub class="fe-subsup-sub">'+node.sub.map((c,i)=>feNodeHTML(c,path.concat('sub',i))).join('')+'</sub>':'')+'</span>';
    case 'int':
      return '<span class="fe-node fe-int" data-path="'+p+'" '+click+'><span class="fe-int-sym">∫</span>'+(node.from&&node.from.length?'<sub class="fe-int-sub">'+node.from.map((c,i)=>feNodeHTML(c,path.concat('from',i))).join('')+'</sub>':'')+(node.to&&node.to.length?'<sup class="fe-int-sup">'+node.to.map((c,i)=>feNodeHTML(c,path.concat('to',i))).join('')+'</sup>':'')+'<span class="fe-int-expr">'+(node.body||[]).map((c,i)=>feNodeHTML(c,path.concat('body',i))).join('')+'<span class="fe-int-d">d</span></span></span>';
    case 'sum':
      return '<span class="fe-node fe-sum" data-path="'+p+'" '+click+'><span class="fe-sum-sup">'+(node.to&&node.to.length?node.to.map((c,i)=>feNodeHTML(c,path.concat('to',i))).join(''):'')+'</span><span class="fe-sum-sym">'+node.sym+'</span><span class="fe-sum-sub">'+(node.from&&node.from.length?node.from.map((c,i)=>feNodeHTML(c,path.concat('from',i))).join(''):'')+'</span><span class="fe-sum-expr">'+(node.body||[]).map((c,i)=>feNodeHTML(c,path.concat('body',i))).join('')+'</span></span>';
    case 'lim':
      return '<span class="fe-node fe-lim" data-path="'+p+'" '+click+'><span class="fe-lim-text">lim</span>'+(node.from&&node.from.length?'<sub class="fe-lim-sub">'+node.from.map((c,i)=>feNodeHTML(c,path.concat('from',i))).join('')+'</sub>':'')+'<span class="fe-lim-expr">'+(node.body||[]).map((c,i)=>feNodeHTML(c,path.concat('body',i))).join('')+'</span></span>';
    case 'mtx': return feMtxHTML(node,path);
    default: return '';
  }
}
function feRender(){
  const c=$('feCanvas');
  // v4.8.0: 重建 DOM 前先摘掉旧编辑框的事件——否则节点被移除时同步触发 blur →
  // feCommitEdit 重入 → 再次给 innerHTML 赋值, 浏览器抛 NotFoundError("moved in a blur handler")
  _feDropEditBox();
  if(_feFocusedPath && !_feSub(feTree,_feFocusedPath)) _feFocusedPath=null;  // 聚焦路径失效则清掉
  const html=feTree.map((n,i)=>feNodeHTML(n,[i])).join('');
  c.innerHTML=html||'<span class="hint">👆 点模板添加公式</span>';
  _fePaintFocus();
  _feSyncLatex();
}

// ── 点击节点 → 局部转源码编辑 ──
function feEditNode(pathStr){
  if(_feEditingPath && _feEditingPath.join('.')!==pathStr) _feCloseEdit();  // 正在编辑别的节点 → 先提交它
  const path=pathStr.split('.').map(x=>isNaN(x)?x:parseInt(x));
  const node=_feSub(feTree,path);
  if(!node) return;
  // 源码框: 在画布中该节点位置显示contenteditable源码
  _feEditingPath=path; _feFocusedPath=path;
  _feDropEditBox();
  const html=feTree.map((n,i)=>feNodeHTML(n,[i])).join('');
  const c=$('feCanvas');
  c.innerHTML=html; // 重渲染使该节点加 fe-editing class
  // 找到该节点DOM, 替换为输入框
  const el=c.querySelector('.fe-node[data-path="'+path.join('.')+'"]');
  if(!el) return;
  const inp=document.createElement('span');
  inp.className='fe-edit-box'; inp.contentEditable='true'; inp.spellcheck=false;
  inp.textContent=feTreeToLatex([node]);
  el.replaceWith(inp);
  inp.focus();
  const sel=window.getSelection(); const r=document.createRange();
  r.selectNodeContents(inp); sel.removeAllRanges(); sel.addRange(r);
  // Enter提交, 失焦提交
  inp.onkeydown=e=>{
    if(e.key==='Enter'){ e.preventDefault(); feCommitEdit(inp,path); }
    if(e.key==='Escape'){ feCancelEdit(); }
    e.stopPropagation();
  };
  inp.onblur=()=>feCommitEdit(inp,path);
  inp.addEventListener('click',e=>e.stopPropagation());
}

// ── 提交编辑: 解析源码→替换树节点→重渲染 ──
let _feCommitting=false;
function feCommitEdit(inp,path){
  if(_feCommitting) return; // 幂等: blur可能二次触发
  _feCommitting=true;
  try{
    const src=inp.textContent.trim();
    const newNode=feParse(src); // 可能是多节点
    const {parent,idx}=_feParentPath(feTree,path);
    if(newNode.length===0){
      parent[idx]={type:'placeholder'};   // v4.8.1: 源码框清空 = 还原成空槽(双击空槽回车不会丢结构)
    }else if(newNode.length===1){
      parent[idx]=newNode[0];
    }else{
      parent.splice(idx,1,...newNode);
    }
    _feEditingPath=null;
    feRender();
  }finally{ _feCommitting=false; }
}
function feCancelEdit(){ _feEditingPath=null; feRender(); }

// ══ v4.8.0: 槽位聚焦(选中) + 嵌套插入 + 键盘直输 ══
function _fePaintFocus(){
  const cur=_feFocusedPath?_feFocusedPath.join('.'):null;
  document.querySelectorAll('#feCanvas .fe-node').forEach(el=>{
    el.classList.toggle('fe-focused', !!cur && el.dataset.path===cur);
  });
}
function feFocusNode(pathStr){
  const path=pathStr.split('.').map(x=>isNaN(x)?x:parseInt(x));
  if(!_feSub(feTree,path)) return;
  _feCloseEdit();               // 有打开的编辑框 → 先提交, 一步到位不丢点击
  _feFocusedPath=path;
  _fePaintFocus();
}
function _feDropEditBox(){      // 重建 DOM 前摘掉旧编辑框的事件, 防 blur 同步重入
  const inp=document.querySelector('.fe-edit-box');
  if(inp){ inp.onblur=null; inp.onkeydown=null; }
}
function _feCloseEdit(){        // 主动提交当前编辑框
  if(!_feEditingPath) return;
  const inp=document.querySelector('.fe-edit-box');
  if(inp) feCommitEdit(inp,_feEditingPath);
  else { _feEditingPath=null; }
}
function _feFirstPlaceholderPath(node,path){  // 深度优先找第一个空槽(含矩阵单元格)
  if(!node) return null;
  if(node.type==='placeholder') return path;
  const keys=['num','den','top','bottom','body','base','sup','sub','from','to'];
  for(const k of keys){
    const arr=node[k];
    if(Array.isArray(arr)) for(let i=0;i<arr.length;i++){
      const r=_feFirstPlaceholderPath(arr[i],path.concat(k,i));
      if(r) return r;
    }
  }
  if(node.type==='mtx'&&Array.isArray(node.cells)){
    for(let ri=0;ri<node.cells.length;ri++) for(let ci=0;ci<node.cells[ri].length;ci++){
      const cell=node.cells[ri][ci]||[];
      for(let i=0;i<cell.length;i++){ const r=_feFirstPlaceholderPath(cell[i],path.concat('cells',ri,ci,i)); if(r) return r; }
    }
  }
  return null;
}
// 点画布空白 → 取消聚焦; 编辑框开着时点其他节点 → 不让 blur 先重建 DOM(否则这一下点击会丢)
const _feCvEl=$('feCanvas');
if(_feCvEl){
  _feCvEl.addEventListener('mousedown',e=>{
    const t=e.target;
    if(t && t.id==='feCanvas'){ _feFocusedPath=null; _fePaintFocus(); return; }
    if(_feEditingPath && !(t.closest && t.closest('.fe-edit-box'))) e.preventDefault();
  });
  // 聚焦状态下的键盘直输: 可打印字符 → 该槽变文本(非槽位则插到其后); Backspace/Delete → 删除
  document.addEventListener('keydown',e=>{
    if(!_feFocusedPath) return;
    if(!$('toolbar').classList.contains('show')) return;
    const ae=document.activeElement;
    if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.isContentEditable)) return;
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    const {parent,idx}=_feParentPath(feTree,_feFocusedPath);
    if(!parent || !Array.isArray(parent)) return;
    const node=parent[idx];
    if(e.key==='Backspace'||e.key==='Delete'){
      e.preventDefault();
      if(parent.length===1) parent[0]={type:'placeholder'};
      else parent.splice(idx,1);
      _feFocusedPath=null; feRender(); return;
    }
    if(e.key.length!==1) return;
    e.preventDefault();
    if(node && node.type==='placeholder'){ parent[idx]={type:'text',value:e.key}; }
    else { parent.splice(idx+1,0,{type:'text',value:e.key}); _feFocusedPath=_feFocusedPath.slice(0,-1).concat(idx+1); }
    feRender();
  });
}

// ── 模板按钮: 在根序列追加节点 ──
function _fePush(node){
  // v4.8.0: 有选中节点 → 插进它那里(占位槽则替换, 其他节点插到其后); 没有 → 追加到画布末尾
  if(_feFocusedPath){
    const {parent,idx}=_feParentPath(feTree,_feFocusedPath);
    if(parent && Array.isArray(parent)){
      let newPath;
      if(parent[idx] && parent[idx].type==='placeholder'){ parent[idx]=node; newPath=_feFocusedPath.slice(0,-1).concat(idx); }
      else { parent.splice(idx+1,0,node); newPath=_feFocusedPath.slice(0,-1).concat(idx+1); }
      _feEditingPath=null;
      _feFocusedPath=_feFirstPlaceholderPath(node,newPath)||newPath;  // 自动选中新公式第一个槽 → 可连点继续嵌套
      feRender();
      return;
    }
  }
  feTree.push(node); _feEditingPath=null; feRender();
}
function feAddFrac(){ _fePush({type:'frac',num:[{type:'placeholder'}],den:[{type:'placeholder'}]}); }
function feAddSqrt(){ _fePush({type:'sqrt',body:[{type:'placeholder'}]}); }
function feAddInt(){ _fePush({type:'int',from:[{type:'placeholder'}],to:[{type:'placeholder'}],body:[{type:'placeholder'}]}); }
function feAddSup(){ _fePush({type:'subsup',base:[{type:'placeholder'}],sup:[{type:'placeholder'}],sub:[]}); }
function feAddSum(){ _fePush({type:'sum',sym:'Σ',from:[{type:'placeholder'}],to:[{type:'placeholder'}],body:[{type:'placeholder'}]}); }
function feAddProd(){ _fePush({type:'sum',sym:'Π',from:[{type:'placeholder'}],to:[{type:'placeholder'}],body:[{type:'placeholder'}]}); }
function feAddLim(){ _fePush({type:'lim',from:[{type:'placeholder'}],body:[{type:'placeholder'}]}); }
function feAddBinom(){ _fePush({type:'binom',top:[{type:'placeholder'}],bottom:[{type:'placeholder'}]}); }
// ── 矩阵 ──
function feAddMtx(){
  const pk=$('tbGridPicker'); const cells=$('tbGridCells'); const label=$('tbGridLabel');
  const maxC=6,maxR=5; let hoverC=3,hoverR=2;
  cells.innerHTML='';
  for(let r=0;r<maxR;r++){
    const row=document.createElement('div'); row.className='tb-grid-row';
    for(let c=0;c<maxC;c++){
      const cell=document.createElement('div'); cell.className='tb-grid-cell';
      cell.addEventListener('mouseenter',()=>{
        hoverC=c+1;hoverR=r+1;
        label.textContent=hoverC+'×'+hoverR;
        document.querySelectorAll('.tb-grid-cell').forEach((el,i)=>{el.classList.toggle('hover',(i%maxC)<=c&&Math.floor(i/maxC)<=r);});
      });
      cell.addEventListener('click',()=>{feInsertMtx(hoverC,hoverR);pk.classList.remove('show');});
      row.appendChild(cell);
    }
    cells.appendChild(row);
  }
  label.textContent='3×2';
  document.querySelectorAll('.tb-grid-cell').forEach((el,i)=>{el.classList.toggle('hover',(i%maxC)<3&&Math.floor(i/maxC)<2);});
  pk.classList.add('show');
}
function feInsertMtx(cols,rows){
  const cells=[];
  for(let r=0;r<rows;r++){
    const rowArr=[];
    for(let c=0;c<cols;c++) rowArr.push([{type:'placeholder'}]);
    cells.push(rowArr);
  }
  _fePush({type:'mtx',cols,rows,cells});
}
// mtx: 树渲染
function feMtxHTML(node,path){
  const p=path.join('.');
  const click='onclick="event.stopPropagation();feFocusNode(\''+p+'\')" ondblclick="event.stopPropagation();feEditNode(\''+p+'\')"';
  let rows='';
  (node.cells||[]).forEach((rowArr,ri)=>{
    let cells=rowArr.map((cell,ci)=>'<span class="fe-mtx-cell">'+cell.map((c,i)=>feNodeHTML(c,path.concat('cells',ri,ci,i))).join('')+'</span>').join('');
    rows+='<span class="fe-mtx-row">'+cells+'</span>';
  });
  return '<span class="fe-node fe-mtx" data-path="'+p+'" '+click+'>'+rows+'</span>';
}
function feMtxLatex(node){
  const cols=node.cols||2;
  let m='\\begin{bmatrix}';
  (node.cells||[]).forEach((rowArr,ri)=>{
    if(ri>0) m+=' \\\\ ';
    m+=rowArr.map(cell=>feTreeToLatex(cell||[])).join(' & ');
  });
  return m+'\\end{bmatrix}';
}

// ── 画布内快速模板: 选中内容转分式等 ──
function _feSyncLatex(){
  const latex=feTreeToLatex(feTree);
  $('feLatexCode').textContent=latex||'(空)';
  $('feEditor').style.display=latex?'':'none';
  _canvasLatex=latex;
  _livePreview();
}

function feClear(){
  feTree=[]; _feEditingPath=null; _feFocusedPath=null; _focusedSlot=null; _canvasLatex=''; _replaceRange=null;
  $('feCanvas').innerHTML='<span class="hint">👆 点模板添加公式</span>';
  $('feLatexCode').textContent='(空)';
  $('feEditor').style.display='none';
  _livePreview();
}
function feUpdate(){ feRender(); }
// 编辑框直输原始LaTeX(不转可视化)
function feUpdateRaw(){
  const raw=document.querySelector('.fe-raw');
  if(raw){ _canvasLatex=raw.textContent.trim(); _livePreview(); }
}
// 从预览载入公式: LaTeX→树→渲染
function feLoadLatex(latex){
  feTree=feParse(latex); _feEditingPath=null; _feFocusedPath=null; _focusedSlot=null;
  if(feTree.length>0){
    feRender();
    $('feEditor').style.display='';
  }else{
    $('feCanvas').innerHTML='<span class="fe-raw" contenteditable="true" style="color:#ccc;font-size:15px" oninput="feUpdateRaw()">'+_feEsc(latex)+'</span>';
    $('feLatexCode').textContent=latex;
    _canvasLatex=latex;
    $('feEditor').style.display='';
  }
  if(!$('toolbar').classList.contains('show')) $('toolbar').classList.add('show');
  const pv=document.querySelector('.block-edit-preview');
  if(pv&&pv.style.display==='none') pv.style.display='';
  const ta=document.querySelector('.block-editor');
  if(ta){
    const escaped=latex.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const regex=new RegExp('\\$\\$?\\s*'+escaped+'\\s*\\$?\\$');
    const m=ta.value.match(regex);
    if(m){ _replaceRange={s:m.index,e:m.index+m[0].length}; }
  }
  _livePreview();
}
function feInsert(){
  let l=$('feLatexCode').textContent;
  if(l==='(空)') return;
  if(!l.startsWith('$')) l='$'+l+'$';
  const ta=document.querySelector('.block-editor'); if(!ta) return;
  const s=ta.selectionStart;
  if(_replaceRange){
    ta.value=ta.value.substring(0,_replaceRange.s)+l+ta.value.substring(_replaceRange.e);
    ta.selectionStart=ta.selectionEnd=_replaceRange.s+l.length;
    _replaceRange=null;
  }else{
    let prefix='', suffix='';
    if(s>0 && ta.value[s-1]==='$') prefix=' ';
    if(s<ta.value.length && ta.value[s]==='$') suffix=' ';
    ta.value=ta.value.substring(0,s)+prefix+l+suffix+ta.value.substring(s);
    ta.selectionStart=ta.selectionEnd=s+prefix.length+l.length+suffix.length;
  }
  _canvasLatex=''; feClear();
  ta.focus(); _autoSizeTA(ta); _livePreview();
}

restoreHandle();

// ── 加载文件（Python 助手） ──
(async function(){
  const params = new URLSearchParams(location.search);
  const filePath = params.get('file');
  if(!filePath) return;
  try {
    const resp = await fetch('/api/read?path='+encodeURIComponent(filePath));
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const data = await resp.json();
    if(data.error) throw new Error(data.error);
    const name = filePath.split(/[\\/]/).pop() || 'file.md';
    openDoc(data.content,name,null,filePath);
  } catch(e) { console.error('Failed to load file:', e); }
})();
